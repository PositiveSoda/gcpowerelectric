<section class="candidatura hidden">

  <h2>Lavora con noi <i class="fa-solid fa-briefcase"></i></h2>
  <p>Compila il form per inviare la tua candidatura.</p>

  <form action="https://formspree.io/f/xrejlbla" method="POST">

    <label>Nome e Cognome</label>
    <input type="text" name="nome" required>

    <label>Email</label>
    <input type="email" name="email" required>

    <label>Telefono</label>
    <input type="tel" name="telefono">

    <label>Esperienza</label>
    <textarea name="esperienza" rows="4" placeholder="Descrivi la tua esperienza..."></textarea>

    <label>Carica CV</label>
    <input type="file">

    <button type="submit">Invia candidatura</button>

  </form>

  <button onclick="window.location.href='index.html'">
    Torna alla Home
  </button>
